<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORLD TRIGGER MR</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Noto Sans JP', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #000000 0%, #0a1a15 50%, #051510 100%);
      color: #ccffe6;
    }

    /* World Trigger style background */

    .wt-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    /* Radar sweep effect */

    .radar-sweep {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200vmax;
      height: 200vmax;
      transform: translate(-50%, -50%);
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(136, 255, 204, 0.15) 30deg,
        transparent 60deg
      );
      animation: radarSpin 8s linear infinite;
    }

    @keyframes radarSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Concentric hexagon rings */

    .hex-rings {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .hex-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(136, 255, 204, 0.2);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      animation: hexRingPulse 4s ease-in-out infinite;
    }

    .hex-ring:nth-child(1) { width: 300px; height: 260px; animation-delay: 0s; }

    .hex-ring:nth-child(2) { width: 500px; height: 433px; animation-delay: 0.5s; }

    .hex-ring:nth-child(3) { width: 700px; height: 606px; animation-delay: 1s; }

    .hex-ring:nth-child(4) { width: 900px; height: 779px; animation-delay: 1.5s; }

    .hex-ring:nth-child(5) { width: 1100px; height: 952px; animation-delay: 2s; }

    @keyframes hexRingPulse {
      0%, 100% { opacity: 0.3; border-color: rgba(136, 255, 204, 0.2); }
      50% { opacity: 0.8; border-color: rgba(136, 255, 204, 0.5); }
    }

    /* Data stream lines */

    .data-streams {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .data-stream {
      position: absolute;
      width: 2px;
      height: 100px;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(136, 255, 204, 0.8),
        transparent
      );
      animation: dataFlow 3s linear infinite;
    }

    @keyframes dataFlow {
      0% { transform: translateY(-100px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }

    /* Trion cubes floating */

    .trion-cubes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .trion-cube {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(136, 255, 204, 0.6);
      background: rgba(136, 255, 204, 0.1);
      animation: cubeFloat 15s ease-in-out infinite;
    }

    .trion-cube::before {
      content: '';
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      border: 1px solid rgba(136, 255, 204, 0.3);
    }

    @keyframes cubeFloat {
      0%, 100% {
        transform: translateY(100vh) rotate(0deg) scale(0.5);
        opacity: 0;
      }
      5% { opacity: 0.8; }
      50% {
        transform: translateY(50vh) rotate(180deg) scale(1);
      }
      95% { opacity: 0.8; }
      100% {
        transform: translateY(-50px) rotate(360deg) scale(0.5);
        opacity: 0;
      }
    }

    /* Scanning lines */

    .scan-line {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(136, 255, 204, 0.5),
        rgba(136, 255, 204, 0.8),
        rgba(136, 255, 204, 0.5),
        transparent
      );
      animation: scanMove 4s linear infinite;
    }

    .scan-line:nth-child(1) { animation-delay: 0s; }

    .scan-line:nth-child(2) { animation-delay: 2s; }

    @keyframes scanMove {
      0% { top: -2px; opacity: 0; }
      5% { opacity: 1; }
      95% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* Corner brackets - Border style UI */

    .corner-bracket {
      position: fixed;
      width: 80px;
      height: 80px;
      border-color: rgba(136, 255, 204, 0.4);
      border-style: solid;
      z-index: 1;
    }

    .corner-bracket-tl {
      top: 30px;
      left: 30px;
      border-width: 3px 0 0 3px;
    }

    .corner-bracket-tr {
      top: 30px;
      right: 30px;
      border-width: 3px 3px 0 0;
    }

    .corner-bracket-bl {
      bottom: 30px;
      left: 30px;
      border-width: 0 0 3px 3px;
    }

    .corner-bracket-br {
      bottom: 30px;
      right: 30px;
      border-width: 0 3px 3px 0;
    }

    /* Status text decoration */

    .status-text {
      position: fixed;
      font-family: 'Cinzel', monospace;
      font-size: 10px;
      color: rgba(136, 255, 204, 0.5);
      letter-spacing: 0.2em;
      z-index: 1;
    }

    .status-text-top {
      top: 35px;
      left: 120px;
    }

    .status-text-bottom {
      bottom: 35px;
      right: 120px;
    }

    /* Vignette effect */

    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(
        ellipse at center,
        transparent 0%,
        transparent 50%,
        rgba(0, 0, 0, 0.5) 100%
      );
    }

    /* Main container */

    #app {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .landing-page {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Header */

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 700;
      color: #000000;
      -webkit-text-stroke: 2px #88ffcc;
      text-shadow:
        0 0 10px rgba(136, 255, 204, 0.8),
        0 0 20px rgba(136, 255, 204, 0.6),
        0 0 40px rgba(136, 255, 204, 0.4);
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: clamp(1rem, 3vw, 1.3rem);
      color: rgba(136, 255, 204, 0.8);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    /* Buttons */

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 25px;
      align-items: center;
    }

    .start-btn {
      position: relative;
      padding: 22px 70px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: 'Noto Sans JP', sans-serif;
      letter-spacing: 0.15em;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      overflow: hidden;
      clip-path: polygon(
        0 0,
        calc(100% - 20px) 0,
        100% 20px,
        100% 100%,
        20px 100%,
        0 calc(100% - 20px)
      );
    }

    .start-btn::before {
      content: '';
      position: absolute;
      inset: 2px;
      background: #000000;
      clip-path: polygon(
        0 0,
        calc(100% - 18px) 0,
        100% 18px,
        100% 100%,
        18px 100%,
        0 calc(100% - 18px)
      );
      z-index: -1;
    }

    .start-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        135deg,
        rgba(136, 255, 204, 0.1) 0%,
        transparent 50%,
        rgba(136, 255, 204, 0.05) 100%
      );
      pointer-events: none;
    }

    .btn-mr {
      background: linear-gradient(135deg, #88ffcc 0%, #44ddaa 50%, #88ffcc 100%);
      color: #88ffcc;
      box-shadow:
        0 0 30px rgba(136, 255, 204, 0.4),
        0 0 60px rgba(136, 255, 204, 0.2),
        inset 0 0 20px rgba(136, 255, 204, 0.1);
      text-shadow:
        0 0 10px rgba(136, 255, 204, 0.8),
        0 0 20px rgba(136, 255, 204, 0.5);
    }

    .btn-mr:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow:
        0 0 50px rgba(136, 255, 204, 0.6),
        0 0 100px rgba(136, 255, 204, 0.3),
        inset 0 0 30px rgba(136, 255, 204, 0.2);
      text-shadow:
        0 0 15px rgba(136, 255, 204, 1),
        0 0 30px rgba(136, 255, 204, 0.8);
    }

    .btn-vr {
      background: linear-gradient(135deg, #66eebb 0%, #33bb88 50%, #66eebb 100%);
      color: #66eebb;
      box-shadow:
        0 0 30px rgba(102, 238, 187, 0.4),
        0 0 60px rgba(102, 238, 187, 0.2),
        inset 0 0 20px rgba(102, 238, 187, 0.1);
      text-shadow:
        0 0 10px rgba(102, 238, 187, 0.8),
        0 0 20px rgba(102, 238, 187, 0.5);
    }

    .btn-vr:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow:
        0 0 50px rgba(102, 238, 187, 0.6),
        0 0 100px rgba(102, 238, 187, 0.3),
        inset 0 0 30px rgba(102, 238, 187, 0.2);
      text-shadow:
        0 0 15px rgba(102, 238, 187, 1),
        0 0 30px rgba(102, 238, 187, 0.8);
    }

    .start-btn:active {
      transform: translateY(0) scale(0.98);
    }

    /* Button blinking animation */

    @keyframes buttonBlink {
      0%, 20%, 40%, 60%, 80%, 100% {
        opacity: 1;
        box-shadow:
          0 0 50px rgba(136, 255, 204, 0.8),
          0 0 100px rgba(136, 255, 204, 0.5),
          inset 0 0 30px rgba(136, 255, 204, 0.3);
      }
      10%, 30%, 50%, 70%, 90% {
        opacity: 0.3;
        box-shadow:
          0 0 20px rgba(136, 255, 204, 0.3),
          0 0 40px rgba(136, 255, 204, 0.2);
      }
    }

    .start-btn.blinking {
      animation: buttonBlink 0.15s ease-in-out infinite;
      pointer-events: none;
    }

    .btn-glow {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(136, 255, 204, 0.4),
        rgba(255, 255, 255, 0.6),
        rgba(136, 255, 204, 0.4),
        transparent
      );
      animation: shimmer 2.5s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      50% { left: 100%; }
      100% { left: 100%; }
    }

    /* Corner decorations */

    .btn-corner {
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: #88ffcc;
      border-style: solid;
    }

    .btn-corner-tl {
      top: 4px;
      left: 4px;
      border-width: 2px 0 0 2px;
    }

    .btn-corner-tr {
      top: 4px;
      right: 24px;
      border-width: 2px 2px 0 0;
    }

    .btn-corner-bl {
      bottom: 4px;
      left: 24px;
      border-width: 0 0 2px 2px;
    }

    .btn-corner-br {
      bottom: 4px;
      right: 4px;
      border-width: 0 2px 2px 0;
    }

    /* Hidden elements for game mode */

    #info {
      position: fixed;
      top: 20px;
      left: 20px;
      color: #88ffcc;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 100;
      border: 1px solid rgba(136, 255, 204, 0.3);
      display: none;
    }

    #depth-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 24px;
      font-size: 16px;
      background: linear-gradient(135deg, #225544, #88ffcc);
      color: #000000;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 20px rgba(136, 255, 204, 0.4);
      transition: all 0.3s;
      z-index: 100;
      display: none;
    }

    #depth-toggle:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 30px rgba(136, 255, 204, 0.5);
    }

    /* Options container */

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 30px;
      padding: 20px 30px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(136, 255, 204, 0.3);
      border-radius: 8px;
      backdrop-filter: blur(5px);
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .option-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border: 2px solid rgba(136, 255, 204, 0.6);
      background: rgba(0, 0, 0, 0.5);
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
    }

    .option-checkbox:hover {
      border-color: #88ffcc;
      box-shadow: 0 0 10px rgba(136, 255, 204, 0.5);
    }

    .option-checkbox:checked {
      background: rgba(136, 255, 204, 0.3);
      border-color: #88ffcc;
    }

    .option-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 6px;
      top: 2px;
      width: 6px;
      height: 12px;
      border: solid #88ffcc;
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }

    .option-label {
      font-size: 1rem;
      color: rgba(136, 255, 204, 0.9);
      letter-spacing: 0.05em;
      cursor: pointer;
      user-select: none;
    }

    .option-label:hover {
      color: #88ffcc;
      text-shadow: 0 0 10px rgba(136, 255, 204, 0.5);
    }

    /* About section */

    .about-container {
      margin-top: 30px;
      padding: 20px 30px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(136, 255, 204, 0.3);
      border-radius: 8px;
      backdrop-filter: blur(5px);
      max-width: 500px;
      text-align: left;
    }

    .about-title {
      font-size: 1.1rem;
      color: #88ffcc;
      margin-bottom: 15px;
      letter-spacing: 0.1em;
      text-align: center;
    }

    .about-text {
      font-size: 0.9rem;
      color: rgba(136, 255, 204, 0.8);
      line-height: 1.8;
      margin-bottom: 10px;
    }

    .about-list {
      list-style: none;
      padding-left: 0;
    }

    .about-list li {
      font-size: 0.85rem;
      color: rgba(136, 255, 204, 0.7);
      line-height: 1.6;
      padding-left: 1.5em;
      position: relative;
      margin-bottom: 5px;
    }

    .about-list li::before {
      content: '▶';
      position: absolute;
      left: 0;
      color: #88ffcc;
      font-size: 0.6em;
      top: 0.4em;
    }

    /* Responsive */

    @media (max-width: 640px) {
      .start-btn {
        padding: 18px 50px;
        font-size: 1.1rem;
      }

      .magic-circle {
        width: 350px;
        height: 350px;
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-CdmqWgLv.js"></script>
</head>
<body>
  <!-- World Trigger Background -->
  <div class="wt-background">
    <!-- Radar sweep -->
    <div class="radar-sweep"></div>

    <!-- Hexagon rings -->
    <div class="hex-rings">
      <div class="hex-ring"></div>
      <div class="hex-ring"></div>
      <div class="hex-ring"></div>
      <div class="hex-ring"></div>
      <div class="hex-ring"></div>
    </div>

    <!-- Data streams -->
    <div class="data-streams" id="data-streams"></div>

    <!-- Trion cubes -->
    <div class="trion-cubes" id="trion-cubes"></div>
  </div>

  <!-- Corner brackets -->
  <div class="corner-bracket corner-bracket-tl"></div>
  <div class="corner-bracket corner-bracket-tr"></div>
  <div class="corner-bracket corner-bracket-bl"></div>
  <div class="corner-bracket corner-bracket-br"></div>

  <!-- Status text -->
  <div class="status-text status-text-top">BORDER DEFENSE AGENCY</div>
  <div class="status-text status-text-bottom">TRIGGER SYSTEM ACTIVE</div>

  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- Three.js container -->
  <div id="app"></div>

  <!-- Landing page -->
  <div class="landing-page" id="landing-page">
    <header class="header">
      <h1 class="title">WORLD TRIGGER MR</h1>
      <p class="subtitle">ワールドトリガー</p>
    </header>

    <div class="button-container">
      <button class="start-btn btn-mr" id="start-button">
        <span class="btn-glow"></span>
        <span class="btn-corner btn-corner-tl"></span>
        <span class="btn-corner btn-corner-tr"></span>
        <span class="btn-corner btn-corner-bl"></span>
        <span class="btn-corner btn-corner-br"></span>
        MR MODE
      </button>
      <button class="start-btn btn-vr" id="vr-button">
        <span class="btn-glow"></span>
        <span class="btn-corner btn-corner-tl"></span>
        <span class="btn-corner btn-corner-tr"></span>
        <span class="btn-corner btn-corner-bl"></span>
        <span class="btn-corner btn-corner-br"></span>
        VR MODE
      </button>
    </div>

    <!-- Options -->
    <div class="options-container">
      <div class="option-row">
        <input type="checkbox" id="occlusion-checkbox" class="option-checkbox" checked>
        <label for="occlusion-checkbox" class="option-label">オクリュージョン（遮蔽処理）</label>
      </div>
    </div>

    <!-- About -->
    <div class="about-container">
      <h3 class="about-title">このアプリについて</h3>
      <p class="about-text">
        ワールドトリガーの世界観をMR/VRで体験できるアプリです。
        ハンドトラッキングを使ってトリガーを発動し、レプリカと戦闘訓練を行います。
      </p>
      <ul class="about-list">
        <li>手を開いて前に向ける → シールド発動</li>
        <li>手を開いて下に向ける → アステロイド（チャージ）</li>
        <li>手を握る → アステロイド発射</li>
        <li>両手でシールド → 固定シールド（大型）</li>
      </ul>
    </div>
  </div>

  <!-- Game UI (hidden initially) -->
  <button id="depth-toggle">深度表示 OFF</button>
  <div id="info">ボックスを表示するには「MRを開始」または「VRを開始」をタップしてください</div>

  <script>
    // Create data streams
    const dataStreamsContainer = document.getElementById('data-streams');
    for (let i = 0; i < 15; i++) {
      const stream = document.createElement('div');
      stream.className = 'data-stream';
      stream.style.left = Math.random() * 100 + '%';
      stream.style.animationDelay = Math.random() * 5 + 's';
      stream.style.animationDuration = (2 + Math.random() * 3) + 's';
      stream.style.height = (50 + Math.random() * 100) + 'px';
      dataStreamsContainer.appendChild(stream);
    }

    // Create trion cubes
    const trionCubesContainer = document.getElementById('trion-cubes');
    for (let i = 0; i < 20; i++) {
      const cube = document.createElement('div');
      cube.className = 'trion-cube';
      cube.style.left = Math.random() * 100 + '%';
      cube.style.animationDelay = Math.random() * 15 + 's';
      cube.style.animationDuration = (12 + Math.random() * 8) + 's';
      const size = 10 + Math.random() * 20;
      cube.style.width = size + 'px';
      cube.style.height = size + 'px';
      trionCubesContainer.appendChild(cube);
    }

    // ボタン決定音
    const buttonSound = new Audio('./決定ボタンを押す4.mp3');
    buttonSound.volume = 0.7;

    // ボタン押下時の演出
    function handleButtonClick(button) {
      // 音声再生
      buttonSound.currentTime = 0;
      buttonSound.play().catch(err => console.log('音声再生エラー:', err));

      // 点滅クラス追加
      button.classList.add('blinking');

      // 1.5秒後にランディングページを非表示
      setTimeout(() => {
        button.classList.remove('blinking');
        document.getElementById('landing-page').style.display = 'none';
      }, 1500);
    }

    // MRボタン
    document.getElementById('start-button').addEventListener('click', function(e) {
      e.preventDefault();
      handleButtonClick(this);
    });

    // VRボタン
    document.getElementById('vr-button').addEventListener('click', function(e) {
      e.preventDefault();
      handleButtonClick(this);
    });
  </script>
</body>
</html>
