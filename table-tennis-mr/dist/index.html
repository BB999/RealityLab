<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Rally - MR Table Tennis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #0d2818 50%, #0a1f14 100%);
            min-height: 100vh;
        }

        /* 卓球台風の背景パターン */
        .table-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .table-line {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
        }

        .table-line.horizontal {
            width: 100%;
            height: 2px;
            top: 50%;
        }

        .table-line.vertical {
            width: 2px;
            height: 100%;
            left: 50%;
        }

        .table-line.border-top {
            width: 80%;
            height: 3px;
            top: 10%;
            left: 10%;
        }

        .table-line.border-bottom {
            width: 80%;
            height: 3px;
            bottom: 10%;
            left: 10%;
        }

        .table-line.border-left {
            width: 3px;
            height: 80%;
            top: 10%;
            left: 10%;
        }

        .table-line.border-right {
            width: 3px;
            height: 80%;
            top: 10%;
            right: 10%;
        }

        /* ネット風デザイン */
        .net {
            position: absolute;
            top: 50%;
            left: 5%;
            right: 5%;
            height: 60px;
            transform: translateY(-50%);
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 8px,
                rgba(255, 255, 255, 0.1) 8px,
                rgba(255, 255, 255, 0.1) 10px
            );
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
        }

        /* ボールアニメーション */
        .ball {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #ffb74d, #ff9800, #e65100);
            border-radius: 50%;
            box-shadow:
                inset -5px -5px 10px rgba(0,0,0,0.3),
                5px 5px 20px rgba(0,0,0,0.4);
            animation: bounce 3s ease-in-out infinite;
            z-index: 1;
        }

        .ball:nth-child(1) {
            top: 20%;
            left: 15%;
            animation-delay: 0s;
        }

        .ball:nth-child(2) {
            top: 70%;
            right: 20%;
            animation-delay: 1s;
            width: 30px;
            height: 30px;
        }

        .ball:nth-child(3) {
            top: 30%;
            right: 10%;
            animation-delay: 2s;
            width: 25px;
            height: 25px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }

        /* メインコンテンツ */
        .main-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* タイトル */
        .title {
            text-align: center;
            margin-bottom: 40px;
        }

        .title h1 {
            font-size: 4rem;
            font-weight: 800;
            color: #fff;
            text-shadow:
                0 0 20px rgba(255, 152, 0, 0.5),
                0 4px 8px rgba(0,0,0,0.5);
            letter-spacing: 0.1em;
            margin-bottom: 10px;
        }

        .title h1 span {
            color: #ff9800;
        }

        .title p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        /* ラケットアイコン */
        .racket-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 50px;
        }

        .racket {
            width: 80px;
            height: 120px;
            position: relative;
        }

        .racket-head {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c62828, #b71c1c);
            box-shadow: inset 0 -5px 15px rgba(0,0,0,0.3);
        }

        .racket-handle {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 50px;
            background: linear-gradient(90deg, #5d4037, #4e342e, #5d4037);
            border-radius: 3px;
        }

        .racket.blue .racket-head {
            background: linear-gradient(135deg, #1565c0, #0d47a1);
        }

        .vs-text {
            font-size: 2rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.5);
            margin: 0 30px;
        }

        /* スタートボタン */
        #xr-button {
            padding: 20px 60px;
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow:
                0 8px 25px rgba(255, 152, 0, 0.4),
                0 4px 10px rgba(0,0,0,0.3);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        #xr-button:hover {
            transform: translateY(-3px);
            box-shadow:
                0 12px 35px rgba(255, 152, 0, 0.5),
                0 6px 15px rgba(0,0,0,0.3);
        }

        #xr-button:active {
            transform: translateY(0);
        }

        #xr-button:disabled {
            background: linear-gradient(135deg, #666, #444);
            box-shadow: none;
            cursor: not-allowed;
        }

        /* ゲーム中UI */
        #game-ui {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
        }

        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #rally {
            color: #00ff00;
            font-size: 42px;
        }

        #msg {
            position: absolute;
            top: 80px;
            width: 100%;
            text-align: center;
            color: #ffeb3b;
            font-size: 16px;
        }

        /* 説明テキスト */
        .instructions {
            margin-top: 40px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            line-height: 1.8;
        }

        .instructions p {
            margin: 5px 0;
        }

        /* フッター */
        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            .title h1 {
                font-size: 2.5rem;
            }

            .title p {
                font-size: 0.9rem;
            }

            #xr-button {
                padding: 15px 40px;
                font-size: 1.2rem;
            }

            .racket {
                width: 60px;
                height: 90px;
            }

            .racket-head {
                width: 60px;
                height: 60px;
            }

            .racket-handle {
                width: 12px;
                height: 40px;
            }
        }
    </style>
  <script type="module" crossorigin src="./assets/index-DKOKn0b6.js"></script>
</head>
<body>
    <!-- 背景パターン -->
    <div class="table-pattern">
        <div class="table-line horizontal"></div>
        <div class="table-line vertical"></div>
        <div class="table-line border-top"></div>
        <div class="table-line border-bottom"></div>
        <div class="table-line border-left"></div>
        <div class="table-line border-right"></div>
        <div class="net"></div>
    </div>

    <!-- メインコンテンツ -->
    <div class="main-content">
        <div class="title">
            <h1>EASY <span>RALLY</span></h1>
            <p>Mixed Reality Table Tennis</p>
        </div>

        <div class="racket-icon">
            <div class="racket">
                <div class="racket-head"></div>
                <div class="racket-handle"></div>
            </div>
            <span class="vs-text">VS</span>
            <div class="racket blue">
                <div class="racket-head"></div>
                <div class="racket-handle"></div>
            </div>
        </div>

        <button id="xr-button">START MR</button>

        <div class="instructions">
            <p>ヘッドセットを装着してコントローラーを握ろう</p>
            <p>トリガーでサーブ、スイングでラリー！</p>
        </div>
    </div>

    <div class="footer">
        Powered by WebXR
    </div>

    <!-- ゲーム中UI -->
    <div id="game-ui">
        <div id="ui">
            RALLY: <span id="rally">0</span><br>
            PLAYER <span id="pScore">0</span> - <span id="cScore">0</span> CPU
        </div>
        <div id="msg">MR Mode - Trigger to Serve</div>
    </div>

</body>
</html>
