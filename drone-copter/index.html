<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone MR - Mixed Reality Drone Simulator</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: 'Rajdhani', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0d0d2a 100%);
    }

    #app {
      width: 100%;
      height: 100%;
    }

    /* Landing Page */
    #landing-page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      overflow-y: auto;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0d0d2a 100%);
    }

    /* Animated Background */
    #landing-page::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(0, 200, 255, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(0, 255, 150, 0.05) 0%, transparent 60%);
      pointer-events: none;
      animation: pulseBackground 8s ease-in-out infinite;
    }

    @keyframes pulseBackground {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Grid Lines */
    .grid-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(0, 200, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 200, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    /* Title Section */
    .title-section {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
      z-index: 1;
    }

    .main-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      text-shadow:
        0 0 10px rgba(0, 200, 255, 0.8),
        0 0 20px rgba(0, 200, 255, 0.5),
        0 0 40px rgba(0, 200, 255, 0.3);
      animation: titleGlow 3s ease-in-out infinite;
    }

    @keyframes titleGlow {
      0%, 100% {
        text-shadow:
          0 0 10px rgba(0, 200, 255, 0.8),
          0 0 20px rgba(0, 200, 255, 0.5),
          0 0 40px rgba(0, 200, 255, 0.3);
      }
      50% {
        text-shadow:
          0 0 20px rgba(0, 200, 255, 1),
          0 0 40px rgba(0, 200, 255, 0.8),
          0 0 60px rgba(0, 200, 255, 0.5);
      }
    }

    .subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(1rem, 3vw, 1.5rem);
      color: rgba(0, 200, 255, 0.7);
      letter-spacing: 0.5em;
      margin-top: 10px;
      font-weight: 300;
    }

    /* Drone Icon */
    .drone-icon {
      width: 200px;
      height: 200px;
      margin: 20px auto;
      position: relative;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 200, 255, 0.1) 0%, transparent 70%);
      box-shadow: 0 0 30px rgba(0, 200, 255, 0.3);
    }

    .drone-icon canvas {
      border-radius: 50%;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    /* Action Buttons */
    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      position: relative;
      z-index: 1;
    }

    .action-btn {
      padding: 18px 50px;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .action-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .action-btn:hover::before {
      left: 100%;
    }

    .mr-btn {
      background: linear-gradient(135deg, #00c8ff 0%, #0080ff 100%);
      color: #fff;
      box-shadow:
        0 0 20px rgba(0, 200, 255, 0.4),
        0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .mr-btn:hover {
      transform: translateY(-3px);
      box-shadow:
        0 0 30px rgba(0, 200, 255, 0.6),
        0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .vr-btn {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
      color: #fff;
      box-shadow:
        0 0 20px rgba(255, 107, 107, 0.4),
        0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .vr-btn:hover {
      transform: translateY(-3px);
      box-shadow:
        0 0 30px rgba(255, 107, 107, 0.6),
        0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    /* Footer */
    .footer-info {
      margin-top: 30px;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.8rem;
      position: relative;
      z-index: 1;
    }

    /* Hidden state for original elements */
    #start-button,
    #vr-button {
      display: none !important;
    }

    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      z-index: 100;
    }

    #depth-toggle {
      position: absolute;
      bottom: 20px;
      right: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: all 0.3s;
      z-index: 100;
      display: none;
    }

    #depth-toggle:hover {
      background: #1976D2;
      transform: scale(1.05);
    }

    /* Scrollbar styling */
    #landing-page::-webkit-scrollbar {
      width: 8px;
    }

    #landing-page::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
    }

    #landing-page::-webkit-scrollbar-thumb {
      background: rgba(0, 200, 255, 0.5);
      border-radius: 4px;
    }

    #landing-page::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 200, 255, 0.7);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .action-btn {
        padding: 15px 35px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Landing Page -->
  <div id="landing-page">
    <div class="grid-overlay"></div>

    <!-- Title Section -->
    <div class="title-section">
      <h1 class="main-title">DOROCON</h1>
      <p class="subtitle">Mixed Reality Drone Simulator</p>

      <!-- 3D Drone Model -->
      <div class="drone-icon" id="drone-3d-container"></div>

      <!-- Action Buttons (under drone icon) -->
      <div class="action-buttons" style="margin-top: 20px;">
        <button class="action-btn mr-btn" id="landing-mr-btn">MR を開始</button>
        <button class="action-btn vr-btn" id="landing-vr-btn">VR を開始</button>
      </div>
    </div>

    <div class="footer-info">
      <p>Quest 3 / Quest Pro 対応 | WebXR Immersive Experience</p>
      <p style="margin-top: 10px;">created by noranekob</p>
    </div>
  </div>

  <button id="start-button">MRを開始</button>
  <button id="vr-button">VRを開始</button>
  <button id="depth-toggle">深度表示 OFF</button>
  <div id="info">ドローンを表示するには「MRを開始」または「VRを開始」をタップしてください</div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    // Landing page 3D drone
    const container = document.getElementById('drone-3d-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
    camera.position.set(0, 0.5, 2);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(400, 400);
    renderer.setClearColor(0x000000, 0);
    container.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0x00c8ff, 1);
    directionalLight.position.set(2, 2, 2);
    scene.add(directionalLight);
    const backLight = new THREE.DirectionalLight(0xff6b6b, 0.5);
    backLight.position.set(-2, 1, -2);
    scene.add(backLight);

    // Load drone model
    let drone = null;
    let propellers = [];
    const loader = new GLTFLoader();
    loader.load('./doron.glb', (gltf) => {
      drone = gltf.scene;
      drone.scale.set(0.8, 0.8, 0.8);
      drone.position.set(0, 0, 0);
      scene.add(drone);

      // Find propellers
      drone.traverse((child) => {
        if (child.name === 'pera1' || child.name === 'pera2' ||
            child.name === 'pera3' || child.name === 'pera4') {
          if (child.geometry) {
            child.geometry.computeBoundingBox();
            const center = new THREE.Vector3();
            child.geometry.boundingBox.getCenter(center);
            child.geometry.translate(-center.x, -center.y, -center.z);
            child.position.copy(center);
          }
          propellers.push(child);
        }
      });

      // 前方向を示す青い光るボックスを追加
      const indicatorGeometry = new THREE.BoxGeometry(0.1, 0.04, 0.01);
      const indicatorMaterial = new THREE.MeshStandardMaterial({
        color: 0x0088ff,
        emissive: 0x0088ff,
        emissiveIntensity: 2,
      });
      const indicator = new THREE.Mesh(indicatorGeometry, indicatorMaterial);
      indicator.position.set(0, 0.04, 0.22);
      drone.add(indicator);

      // 点滅パターン: 0.15秒表示→0.15秒消灯→0.15秒表示→1.5秒消灯→ループ
      let blinkState = 0;
      const blinkPattern = [
        { visible: true, duration: 150 },
        { visible: false, duration: 150 },
        { visible: true, duration: 150 },
        { visible: false, duration: 1000 },
      ];

      function blink() {
        indicator.visible = blinkPattern[blinkState].visible;
        setTimeout(() => {
          blinkState = (blinkState + 1) % blinkPattern.length;
          blink();
        }, blinkPattern[blinkState].duration);
      }
      blink();
    });

    // Animation loop
    let hoverTime = 0;
    function animate() {
      requestAnimationFrame(animate);

      if (drone) {
        // Hover animation
        hoverTime += 0.016;
        drone.position.y = Math.sin(hoverTime * 1.2) * 0.05;
        drone.rotation.y += 0.005;

        // Rotate propellers
        propellers.forEach(prop => {
          prop.rotation.y += 0.5;
        });
      }

      renderer.render(scene, camera);
    }
    animate();

    // Landing page button handlers
    document.getElementById('landing-mr-btn').addEventListener('click', function() {
      document.getElementById('landing-page').style.display = 'none';
      document.getElementById('start-button').click();
    });

    document.getElementById('landing-vr-btn').addEventListener('click', function() {
      document.getElementById('landing-page').style.display = 'none';
      document.getElementById('vr-button').click();
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
