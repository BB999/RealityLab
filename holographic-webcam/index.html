<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Display</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="three-canvas"></canvas>
    <div id="debug">
      <span id="face-status">顔検出: 待機中...</span>
    </div>
  </div>
  <div id="controls">
    <label>
      GLBモデル:
      <input type="file" id="glb-input" accept=".glb,.gltf">
    </label>
    <label>
      感度:
      <input type="range" id="sensitivity" min="0.1" max="5" step="0.1" value="3">
      <span id="sensitivity-value">3.0</span>
    </label>
    <label>
      スケール:
      <input type="range" id="scale" min="0.1" max="5" step="0.1" value="1">
      <span id="scale-value">1.0</span>
    </label>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
