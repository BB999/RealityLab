<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Display</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script type="module" crossorigin src="./assets/index-B-6sBpyd.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Bav4ZJDm.css">
</head>
<body>
  <div id="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="three-canvas"></canvas>
    <div id="debug">
      <span id="face-status">顔検出: 待機中...</span>
    </div>
  </div>
  <div id="controls">
    <label>
      GLBモデル:
      <input type="file" id="glb-input" accept=".glb,.gltf">
    </label>
    <label>
      感度:
      <input type="range" id="sensitivity" min="0.1" max="5" step="0.1" value="3">
      <span id="sensitivity-value">3.0</span>
    </label>
    <label>
      スケール:
      <input type="range" id="scale" min="0.1" max="5" step="0.1" value="1">
      <span id="scale-value">1.0</span>
    </label>
  </div>
</body>
</html>
